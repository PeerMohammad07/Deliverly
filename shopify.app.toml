# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c46401d59f8d86e719381f5d5545946e"
name = "Deliverly"
application_url = "https://deliverly.peeru548.workers.dev"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_app_proxy,read_themes"
optional_scopes = [ ]
use_legacy_install_flow = false

# Storefront rule config, rebuilt from D1 on every rule change. Read by
# the app embed as shop.metafields["$app"].deliverly_config.
[shop.metafields.app.deliverly_config]
type = "json"
name = "Deliverly config"
description = "Delivery rules for the storefront widget. Managed by Deliverly."
access.admin = "merchant_read"
access.storefront = "public_read"

[app_proxy]
url = "/api/estimate"
prefix = "apps"
subpath = "delivery-estimate"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/update"
  topics = [ "shop/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://deliverly.peeru548.workers.dev/auth/callback" ]

[build]
# Staging app on the Cloudflare Worker: `shopify app dev` must never swap
# these URLs for a tunnel. Local development uses shopify.app.development.toml.
automatically_update_urls_on_dev = false
